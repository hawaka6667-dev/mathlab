<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MathLab | Standard, Derivatives & Superposition Engine</title>
  <link rel="stylesheet" href="css/studio.css">
</head>
<body>

  <header>
    <div class="brand">
      <span class="dot-live"></span>
      <span>MathLab</span>
      <span style="font-size: 11px; opacity: 0.6; font-family: monospace;">:8080</span>
    </div>

    <!-- 3-Mode Tab Switcher -->
    <div class="tab-group">
      <button class="tab-btn active" data-tab="tab-superposition">🧬 分量叠加</button>
      <button class="tab-btn" data-tab="tab-derivatives">🔀 逐阶求导</button>
      <button class="tab-btn" data-tab="tab-standard">📈 基础单图</button>
    </div>

    <!-- Explicit Form with Enter & Submit Button -->
    <form id="formulaForm" class="input-form">
      <span>Formula =</span>
      <input type="text" id="exprInput" value="f(x) = x^2 + 4000/x" spellcheck="false" placeholder="输入公式或 LaTeX (按 Enter 或点 ↵ 绘制)...">
      <button type="submit" class="btn btn-submit" id="btnSubmit" title="执行绘制 (Enter)">↵ 绘制</button>
      <button type="button" class="btn btn-star" id="btnStar" title="收藏/取消收藏当前函数">☆ 收藏</button>
    </form>

    <div class="status-readout">
      <span id="activeInspect">Inspection: <b style="color: #64748b;">(Hover over plot)</b></span>
      <button type="button" class="btn btn-console" id="btnToggleConsole" title="打开/折叠诊断控制台 (快捷键: ~)">📟 控制台 <span id="logBadge" class="log-badge">0</span></button>
      <button type="button" class="btn btn-favs" id="btnOpenFavs" title="打开收藏夹">📑 收藏夹 (<span id="favCount">0</span>)</button>
      <button type="button" class="btn btn-random" id="btnRandom" title="随机摇一个经典分析学/微积分函数 (快捷键: R)">🎲 随机摇函数</button>
      <button type="button" class="btn" id="btnResetAll" title="重置全部视角为中心十字轴">🎯 Reset All</button>
    </div>
  </header>

  <!-- Tab Views Container -->
  <div id="tabViews">

    <!-- Mode 1: 基础单图 -->
    <div class="tab-content" id="tab-standard">
      <div id="standardWrap">
        <div class="panel-header" style="border-top: 2px solid var(--c0);">
          <span class="panel-formula" id="formStandard" style="color: var(--c0);">f(x)</span>
        </div>
        <div class="canvas-wrap">
          <canvas id="cvStandard"></canvas>
          <div class="mouse-tooltip" id="tipStandard"></div>
        </div>
      </div>
    </div>

    <!-- Mode 2: 逐阶求导 (6-Grid Multi-Panel) -->
    <div class="tab-content" id="tab-derivatives">
      <div id="derivativesGrid">
        <div class="panel-card" style="border-top: 2px solid var(--c0);">
          <div class="panel-header"><span class="panel-formula" id="form0" style="color: var(--c0);">f(x)</span></div>
          <div class="canvas-wrap"><canvas id="cv0"></canvas><div class="mouse-tooltip" id="tip0"></div></div>
        </div>
        <div class="panel-card" style="border-top: 2px solid var(--c1);">
          <div class="panel-header"><span class="panel-formula" id="form1" style="color: var(--c1);">f'(x)</span></div>
          <div class="canvas-wrap"><canvas id="cv1"></canvas><div class="mouse-tooltip" id="tip1"></div></div>
        </div>
        <div class="panel-card" style="border-top: 2px solid var(--c2);">
          <div class="panel-header"><span class="panel-formula" id="form2" style="color: var(--c2);">f''(x)</span></div>
          <div class="canvas-wrap"><canvas id="cv2"></canvas><div class="mouse-tooltip" id="tip2"></div></div>
        </div>
        <div class="panel-card" style="border-top: 2px solid var(--c3);">
          <div class="panel-header"><span class="panel-formula" id="form3" style="color: var(--c3);">f'''(x)</span></div>
          <div class="canvas-wrap"><canvas id="cv3"></canvas><div class="mouse-tooltip" id="tip3"></div></div>
        </div>
        <div class="panel-card" style="border-top: 2px solid var(--c4);">
          <div class="panel-header"><span class="panel-formula" id="form4" style="color: var(--c4);">f⁽⁴⁾(x)</span></div>
          <div class="canvas-wrap"><canvas id="cv4"></canvas><div class="mouse-tooltip" id="tip4"></div></div>
        </div>
        <div class="panel-card" style="border-top: 2px solid var(--c5);">
          <div class="panel-header"><span class="panel-formula" id="form5" style="color: var(--c5);">f⁽⁵⁾(x)</span></div>
          <div class="canvas-wrap"><canvas id="cv5"></canvas><div class="mouse-tooltip" id="tip5"></div></div>
        </div>
      </div>
    </div>

    <!-- Mode 3: 分量叠加与拆解 (Superposition & Components) -->
    <div class="tab-content active" id="tab-superposition">
      <div id="superpositionWrap">
        <!-- Left: Superposition Composite Overlay -->
        <div class="super-overlay-card">
          <div class="panel-header" style="border-top: 2px solid var(--c0);">
            <span class="panel-formula" id="formSuperOverlay" style="color: var(--c0);">f(x) [合成曲线 & 分量基底叠加]</span>
            <div id="overlayLegend" style="font-size: 11px; margin-left: auto;"></div>
          </div>
          <div class="canvas-wrap">
            <canvas id="cvOverlay"></canvas>
            <div class="mouse-tooltip" id="tipOverlay"></div>
          </div>
        </div>

        <!-- Right: Standalone Components Subplots Grid -->
        <div class="super-components-grid" id="compCardsContainer"></div>
      </div>
    </div>

  </div>

  <!-- Favorites Drawer Modal -->
  <div id="favsModal">
    <div class="drawer-header">
      <span>⭐ 我的数学收藏夹 (Favorites)</span>
      <button class="close-btn" id="btnCloseFavs">✕</button>
    </div>
    <div class="drawer-body" id="favsList"></div>
  </div>

  <!-- MathLab In-App Diagnostics HUD / Console Drawer -->
  <div id="consoleDrawer">
    <div class="console-header">
      <div class="console-title">
        <span class="dot-live"></span>
        <b>MathLab HUD Diagnostics & Runtime Logger</b>
        <span class="hud-pill" id="hudEngineStatus">AST: READY</span>
        <span class="hud-pill" id="hudActiveVar">Var: x</span>
      </div>
      <div class="console-tabs">
        <button class="c-tab active" data-filter="ALL">全部 (All)</button>
        <button class="c-tab" data-filter="AST">AST 符号树</button>
        <button class="c-tab" data-filter="SOLVER">微积分求解</button>
        <button class="c-tab" data-filter="API">网络请求</button>
        <button class="c-tab" data-filter="ERRORS">错误/告警</button>
      </div>
      <div class="console-actions">
        <button class="c-act-btn" id="btnRefreshLogs" title="从服务端同步最新日志">🔄 刷新</button>
        <button class="c-act-btn" id="btnClearLogs" title="清空本地与服务端日志">🗑️ 清空</button>
        <button class="c-act-btn" id="btnCopyLogs" title="复制当前过滤的日志到剪贴板">📋 复制</button>
        <button class="c-close-btn" id="btnCloseConsole" title="关闭控制台 (~)">✕</button>
      </div>
    </div>
    <div class="console-body" id="consoleBody"></div>
  </div>

  <!-- Modular Scripts Orchestration -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
